version: "3.9"

services:
  # ─────────────────────────────────────────────
  # Python Color Science Engine
  # ─────────────────────────────────────────────
  engine:
    build:
      context: ./packages/engine
      dockerfile: Dockerfile
    container_name: colorgenius_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - engine_models:/models
      - engine_uploads:/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - colorgenius

  # ─────────────────────────────────────────────
  # Fastify API Server
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: colorgenius_api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://colorgenius:colorgenius@db:5432/colorgenius
      JWT_SECRET: ${JWT_SECRET:-colorgenius-dev-secret-change-in-prod}
      PYTHON_ENGINE_URL: http://engine:8000
      UPLOAD_DIR: /uploads
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3001}
    volumes:
      - api_uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - colorgenius

  # ─────────────────────────────────────────────
  # Next.js Web Frontend
  # ─────────────────────────────────────────────
  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: colorgenius_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_BASE_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${APP_BASE_URL:-http://localhost:3000}
    volumes:
      - ./packages/web:/app:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - colorgenius

  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: colorgenius_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: colorgenius
      POSTGRES_PASSWORD: colorgenius
      POSTGRES_DB: colorgenius
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colorgenius -d colorgenius"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - colorgenius

  # ─────────────────────────────────────────────
  # Redis (caching / sessions)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: colorgenius_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - colorgenius

  # ─────────────────────────────────────────────
  # Nginx (reverse proxy / SSL termination)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: colorgenius_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - colorgenius

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  engine_models:
    driver: local
  engine_uploads:
    driver: local
  api_uploads:
    driver: local
  nginx_logs:
    driver: local

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  colorgenius:
    driver: bridge